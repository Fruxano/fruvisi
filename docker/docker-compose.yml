# Local dev environment for the FruVisi dashboard plugin.
# Image pinned to v2026.7.7.2 = Hermes 0.18.2 (identical to the target install).
# The plugin folder is mounted straight into the Hermes home so changes show
# up via /api/dashboard/plugins/rescan without copying.
# Explicit project name: avoids collisions with other compose projects that
# were started from a "docker/" folder.
name: hermes-org-dev

services:
  hermes:
    image: nousresearch/hermes-agent:v2026.7.7.2
    container_name: hermes-org-dev
    command: dashboard --no-open --host 0.0.0.0 --port 9119 --insecure
    ports:
      - "127.0.0.1:9119:9119"
    volumes:
      - ./hermes-data:/opt/data
      - ../plugin:/opt/data/plugins/fruvisi
    restart: unless-stopped
